"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":10,"verse_start_alt":"10","verse_end":10,"verse_end_alt":"10","verse_text":"Hezekiah the father of Manasseh, Manasseh the father of Amon, Amon the father of Josiah,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":11,"verse_start_alt":"11","verse_end":11,"verse_end_alt":"11","verse_text":"and Josiah the father of Jeconiah and his brothers at the time of the exile to Babylon."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":12,"verse_start_alt":"12","verse_end":12,"verse_end_alt":"12","verse_text":"After the exile to Babylon: Jeconiah was the father of Shealtiel, Shealtiel the father of Zerubbabel,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":13,"verse_start_alt":"13","verse_end":13,"verse_end_alt":"13","verse_text":"Zerubbabel the father of Abiud, Abiud the father of Eliakim, Eliakim the father of Azor,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":14,"verse_start_alt":"14","verse_end":14,"verse_end_alt":"14","verse_text":"Azor the father of Zadok, Zadok the father of Akim, Akim the father of Eliud,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":15,"verse_start_alt":"15","verse_end":15,"verse_end_alt":"15","verse_text":"Eliud the father of Eleazar, Eleazar the father of Matthan, Matthan the father of Jacob,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":16,"verse_start_alt":"16","verse_end":16,"verse_end_alt":"16","verse_text":"and Jacob the father of Joseph, the husband of Mary, of whom was born Jesus, who is called Christ."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":17, e_text":"A record of the genealogy of Jesus Christ the son of David, the son of Abraham:"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":2,"verse_start_alt":"2","verse_end":2,"verse_end_alt":"2","verse_text":"Abraham was the father of Isaac, Isaac the father of Jacob, Jacob the father of Judah and his brothers,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":3,"verse_start_alt":"3","verse_end":3,"verse_end_alt":"3","verse_text":"Judah the father of Perez and Zerah, whose mother was Tamar, Perez the father of Hezron, Hezron the father of Ram,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":4,"verse_start_alt":"4","verse_end":4,"verse_end_alt":"4","verse_text":"Ram the father of Amminadab, Amminadab the father of Nahshon, Nahshon the father of Salmon,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":5,"verse_start_alt":"5","verse_end":5,"verse_end_alt":"5","verse_text":"Salmon the father of Boaz, whose mother was Rahab, Boaz the father of Obed, whose mother was Ruth, Obed the father of Jesse,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":6,"verse_start_alt":"6","verse_end":6,"verse_end_alt":"6","verse_text":"and Jesse the father of King David. David was the father of Solomon, whose mother had been Uriah's wife,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":7,"verse_start_alt":"7","verse_end":7,"verse_end_alt":"7","verse_text":"Solomon the father of Rehoboam, Rehoboam the father of Abijah, Abijah the father of Asa,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":8,"verse_start_alt":"8","verse_end":8,"verse_end_alt":"8","verse_text":"Asa the father of Jehoshaphat, Jehoshaphat the father of Jehoram, Jehoram the father of Uzziah,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":9,"verse_start_alt":"9","verse_end":9,"verse_end_alt":"9","verse_text":"Uzziah the father of Jotham, Jotham the father of Ahaz, Ahaz the father of Hezekiah,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":10,"verse_start_alt":"10","verse_end":10,"verse_end_alt":"10","verse_text":"Hezekiah the father of Manasseh, Manasseh the father of Amon, Amon the father of Josiah,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":11,"verse_start_alt":"11","verse_end":11,"verse_end_alt":"11","verse_text":"and Josiah the father of Jeconiah and his brothers at the time of the exile to Babylon."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":12,"verse_start_alt":"12","verse_end":12,"verse_end_alt":"12","verse_text":"After the exile to Babylon: Jeconiah was the father of Shealtiel, Shealtiel the father of Zerubbabel,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":13,"verse_start_alt":"13","verse_end":13,"verse_end_alt":"13","verse_text":"Zerubbabel the father of Abiud, Abiud the father of Eliakim, Eliakim the father of Azor,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":14,"verse_start_alt":"14","verse_end":14,"verse_end_alt":"14","verse_text":"Azor the father of Zadok, Zadok the father of Akim, Akim the father of Eliud,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":15,"verse_start_alt":"15","verse_end":15,"verse_end_alt":"15","verse_text":"Eliud the father of Eleazar, Eleazar the father of Matthan, Matthan the father of Jacob,"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":16,"verse_start_alt":"16","verse_end":16,"verse_end_alt":"16","verse_text":"and Jacob the father of Joseph, the husband of Mary, of whom was born Jesus, who is called Christ."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":17,"verse_start_alt":"17","verse_end":17,"verse_end_alt":"17","verse_text":"Thus there were fourteen generations in all from Abraham to David, fourteen from David to the exile to Babylon, and fourteen from the exile to the Christ."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":18,"verse_start_alt":"18","verse_end":18,"verse_end_alt":"18","verse_text":"This is how the birth of Jesus Christ came about: His mother Mary was pledged to be married to Joseph, but before they came together, she was found to be with child through the Holy Spirit."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":19,"verse_start_alt":"19","verse_end":19,"verse_end_alt":"19","verse_text":"Because Joseph her husband was a righteous man and did not want to expose her to public disgrace, he had in mind to divorce her quietly."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":20,"verse_start_alt":"20","verse_end":20,"verse_end_alt":"20","verse_text":"But after he had considered this, an angel of the Lord appeared to him in a dream and said, “Joseph son of David, do not be afraid to take Mary home as your wife, because what is conceived in her is from the Holy Spirit."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":21,"verse_start_alt":"21","verse_end":21,"verse_end_alt":"21","verse_text":"She will give birth to a son, and you are to give him the name Jesus, because he will save his people from their sins.”"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":22,"verse_start_alt":"22","verse_end":22,"verse_end_alt":"22","verse_text":"All this took place to fulfill what the Lord had said through the prophet:"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":23,"verse_start_alt":"23","verse_end":23,"verse_end_alt":"23","verse_text":"“The virgin will be with child and will give birth to a son, and they will call him Immanuel” –which means, “God with us.”"},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":24,"verse_start_alt":"24","verse_end":24,"verse_end_alt":"24","verse_text":"When Joseph woke up, he did what the angel of the Lord had commanded him and took Mary home as his wife."},{"book_id":"MAT","book_name":"Matthew","book_name_alt":"MATTHEW","chapter":1,"chapter_alt":"1","verse_start":25,"verse_start_alt":"25","verse_end":25,"verse_end_alt":"25","verse_text":"But he had no union with her until she gave birth to a son. And he gave him the name Jesus."}],"audioObjects":[],"activeFilesets":[{"id":"ENGNIVN_ET","type":"text_plain","size":"NT","stock_no":null,"volume":"Holy Bible, New International Version®"},{"id":"ENGNIVN2DA-opus16","type":"audio_drama","size":"NT","stock_no":null,"bitrate":"16kbps","codec":"opus","container":"webm","volume":"Holy Bible, New International Version®"},{"id":"ENGNIVN_ET-json","type":"text_json","size":"NT","stock_no":null,"volume":"Holy Bible, New International Version®"},{"id":"ENGNIVN2DA","type":"audio_drama","size":"NT","stock_no":null,"bitrate":"64kbps","codec":"mp3","container":"mp3","product_code":"N2NIV","timing_est_err":"5","volume":"Holy Bible, New International Version®"},{"id":"ENGNIVN1DA","type":"audio","size":"NT","stock_no":null,"bitrate":"64kbps","codec":"mp3","container":"mp3","produc
